<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <button id="btn-sync" class="primary" data-i18n="popupSyncAll"></button>

  <div id="event-block" hidden>
    <div id="event-title"></div>
    <div id="event-time" class="muted"></div>
    <div class="row">
      <button id="btn-accept" class="primary" data-i18n="popupAccept"></button>
      <button id="btn-tentative" data-i18n="popupTentative"></button>
      <button id="btn-decline" data-i18n="popupDecline"></button>
    </div>
  </div>

  <button id="btn-settings" class="muted-btn" data-i18n="popupSettings"></button>

  <p id="hint" class="muted"></p>

  <script src="popup.js"></script>
</body>
</html>
