<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Exchange EWS Calendar</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <h1 data-i18n="optionsTitle"></h1>

  <section id="list-section">
    <h2 data-i18n="calendarsHeading"></h2>
    <div id="calendar-list"></div>
    <p id="no-calendars" class="muted" data-i18n="noCalendars" hidden></p>
    <button id="btn-add" data-i18n="addCalendar"></button>
  </section>

  <section id="form-section" hidden>
    <h2 id="form-title"></h2>
    <label>
      <span data-i18n="fieldUrl"></span>
      <input id="f-url" type="url" placeholder="https://owa.example.com/ews/exchange.asmx" />
    </label>
    <label>
      <span data-i18n="fieldEmail"></span>
      <input id="f-email" type="email" />
    </label>
    <label>
      <span data-i18n="fieldDisplayName"></span>
      <input id="f-name" type="text" />
    </label>
    <label>
      <span data-i18n="fieldAuthMethod"></span>
      <select id="f-auth">
        <option value="auto" data-i18n="authAuto"></option>
        <option value="ntlm" data-i18n="authNtlm"></option>
        <option value="basic" data-i18n="authBasic"></option>
      </select>
    </label>
    <label>
      <span data-i18n="fieldPassword"></span>
      <input id="f-password" type="password" />
      <small id="password-hint" class="muted" hidden data-i18n="passwordKeep"></small>
    </label>
    <label>
      <span data-i18n="fieldRefreshInterval"></span>
      <input id="f-interval" type="number" min="1" max="1440" value="30" />
    </label>
    <label class="checkbox">
      <input id="f-readonly" type="checkbox" />
      <span data-i18n="fieldReadOnly"></span>
    </label>
    <div class="row">
      <button id="btn-save" class="primary" data-i18n="save"></button>
      <button id="btn-test" data-i18n="testConnection"></button>
      <button id="btn-cancel" data-i18n="cancel"></button>
    </div>
  </section>

  <p id="status-line" class="muted"></p>

  <script src="options.js"></script>
</body>
</html>
